name: BUSINESS-06 Nusa Forma React Vite

on:
  pull_request:
    paths:
      - "experiments/business-06-nusa-forma-react/**"
      - ".github/workflows/business-06-react-vite.yml"
  push:
    branches: [main]
    paths:
      - "experiments/business-06-nusa-forma-react/**"
      - ".github/workflows/business-06-react-vite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/business-06-nusa-forma-react
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run check
      - name: Verify production output
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser, responsive and accessibility QA
        run: npm run test:e2e
      - name: Upload rendered website evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nusa-forma-react-browser-evidence
          path: experiments/business-06-nusa-forma-react/test-results/evidence/
          if-no-files-found: ignore
