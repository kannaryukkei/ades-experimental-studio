name: BUSINESS-05 validation

on:
  push:
    branches: [experiment/business-05-archetype-redesign]
    paths:
      - ".github/workflows/business-05-validation.yml"
      - "engine/src/lib/**"
      - "experiments/business-05/**"
  pull_request:
    branches: [main]
    paths:
      - "engine/src/lib/**"
      - "experiments/business-05/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build all BUSINESS-05 archetypes
        working-directory: experiments/business-05
        run: npm run build
      - name: Run BUSINESS-05 tests
        working-directory: experiments/business-05
        run: npm test

  browser-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser QA dependency
        working-directory: experiments/business-05
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        working-directory: experiments/business-05
        run: npx playwright install --with-deps chromium
      - name: Build all BUSINESS-05 archetypes
        working-directory: experiments/business-05
        run: npm run build
      - name: Run browser journeys and responsive checks
        working-directory: experiments/business-05
        run: npm run browser-test
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-05-browser-evidence
          path: experiments/business-05/.qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
