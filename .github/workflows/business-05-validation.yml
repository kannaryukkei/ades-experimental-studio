name: BUSINESS-05 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/src/lib/**"
      - "experiments/business-05/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build all BUSINESS-05 archetypes
        working-directory: experiments/business-05
        run: npm run build
      - name: Run BUSINESS-05 tests
        working-directory: experiments/business-05
        run: npm test
